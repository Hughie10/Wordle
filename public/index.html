<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wordle Multiplayer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Wordle Multiplayer</h1>
        <p>Play solo instantly. Sign in only when you want multiplayer modes.</p>
      </div>
      <div class="auth-menu">
        <button class="secondary" id="auth-toggle-btn">Login</button>
        <section class="panel hidden auth-panel" id="auth-panel">
          <h2>Sign in</h2>
          <div class="row">
            <input id="username" type="text" placeholder="Username (3-20 chars)" />
            <button id="register-btn">Register / Login</button>
          </div>
          <p id="auth-status"></p>
        </section>
      </div>
    </header>

    <main class="app-layout">
      <section class="main-column">
        <section class="panel">
          <h2>Wordle Board</h2>
          <p id="game-meta"></p>
          <div id="hint-box"></div>
          <div id="board"></div>
          <div class="row">
            <input id="guess" type="text" placeholder="Enter guess" />
            <button id="guess-btn">Submit Guess</button>
          </div>
        </section>

        <section class="panel">
          <h3>Solo Controls</h3>
          <div class="row">
            <label>Letter Count
              <input id="letter-count" type="number" min="3" max="8" value="5" />
            </label>
            <button id="start-solo-btn">Start New Solo Game</button>
          </div>
        </section>
      </section>

      <aside class="right-sidebar hidden" id="mode-sidebar">
        <section class="panel">
          <h2>Game Modes</h2>
          <div class="mode-cards" id="mode-cards"></div>
        </section>

        <section class="panel hidden" id="mode-panel">
          <h3 id="mode-panel-title">Mode</h3>
          <p id="mode-help-text"></p>
          <div class="row">
            <input id="opponent" list="user-options" placeholder="Search username" />
            <button id="challenge-btn">Challenge</button>
          </div>
          <datalist id="user-options"></datalist>
          <div id="challenge-fields" class="hidden">
            <label>Assigned Word (dictionary word)
              <input id="assigned-word" type="text" maxlength="8" placeholder="dictionary word" />
            </label>
            <label>Hint / Category (optional)
              <input id="hint" type="text" maxlength="100" placeholder="e.g. Music genre" />
            </label>
          </div>
          <p id="mode-status"></p>
          <div id="mode-sections"></div>
        </section>
      </aside>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
